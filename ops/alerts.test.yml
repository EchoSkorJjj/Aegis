rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: Feed failure holds for 45 minutes and resolves on recovery
    interval: 1m
    input_series:
      - series: 'aegis_ingestion_health{source_id="nvd",job="aegis-core",instance="core:8082"}'
        values: '0x45 1x5'
    alert_rule_test:
      - eval_time: 44m
        alertname: AegisFeedDown
        exp_alerts: []
      - eval_time: 45m
        alertname: AegisFeedDown
        exp_alerts:
          - exp_labels:
              instance: "core:8082"
              job: "aegis-core"
              severity: "warning"
              source_id: "nvd"
            exp_annotations:
              summary: "Feed nvd has been unhealthy for 45 minutes"
              description: "Check feed poll failures, last success, connectivity and credentials. See ops/README.md#alert-runbook."
      - eval_time: 46m
        alertname: AegisFeedDown
        exp_alerts: []
  - name: Brief feed recovery resets the pending duration
    interval: 1m
    input_series:
      - series: 'aegis_ingestion_health{source_id="nvd",job="aegis-core",instance="core:8082"}'
        values: '0x30 1 0x50'
    alert_rule_test:
      - eval_time: 60m
        alertname: AegisFeedDown
        exp_alerts: []
      - eval_time: 76m
        alertname: AegisFeedDown
        exp_alerts: []
      - eval_time: 77m
        alertname: AegisFeedDown
        exp_alerts:
          - exp_labels:
              instance: "core:8082"
              job: "aegis-core"
              severity: "warning"
              source_id: "nvd"
            exp_annotations:
              summary: "Feed nvd has been unhealthy for 45 minutes"
              description: "Check feed poll failures, last success, connectivity and credentials. See ops/README.md#alert-runbook."
  - name: Hourly backlog growth requires a complete hour and a five-minute hold
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '0+1x90'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x90'
    alert_rule_test:
      - eval_time: 64m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 65m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Decision queue has kept growing for an hour"
              description: "The queue grew in each half of the last hour. Check Review & approve, owner assignments and failed filings. See ops/README.md#alert-runbook."
  - name: Growth every ten minutes survives the pauses between drafts
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '0x9 1x9 2x9 3x9 4x9 5x9 6x9 7x9 8x9'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x89'
    alert_rule_test:
      - eval_time: 64m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 65m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Decision queue has kept growing for an hour"
              description: "The queue grew in each half of the last hour. Check Review & approve, owner assignments and failed filings. See ops/README.md#alert-runbook."
  - name: Growth every thirty minutes also alerts
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '0x29 1x29 2x29'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x89'
    alert_rule_test:
      - eval_time: 65m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Decision queue has kept growing for an hour"
              description: "The queue grew in each half of the last hour. Check Review & approve, owner assignments and failed filings. See ops/README.md#alert-runbook."
  - name: One draft left undecided is not a growing backlog
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '5x89 6x60'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x149'
    alert_rule_test:
      - eval_time: 96m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 140m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
  - name: A draft decided ten minutes later is not a growing backlog
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '20x89 21x9 20x50'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x149'
    alert_rule_test:
      - eval_time: 99m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
  - name: Flat and declining queues do not alert
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '100x60 100-1x70'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x131'
    alert_rule_test:
      - eval_time: 64m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 130m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
  - name: Queue recovery clears the growing backlog alert
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '0+1x70 69-1x40'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x111'
    alert_rule_test:
      - eval_time: 65m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Decision queue has kept growing for an hour"
              description: "The queue grew in each half of the last hour. Check Review & approve, owner assignments and failed filings. See ops/README.md#alert-runbook."
      - eval_time: 90m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
  - name: Stale refresh is not an empty or growing queue
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '0+1x90'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 9m
        alertname: AegisDecisionQueueMetricsStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Decision queue depth is unavailable"
              description: "Check the scheduler lease, identity internal token and database. No partial queue total is published. See ops/README.md#alert-runbook."
    promql_expr_test:
      - expr: "aegis:decision_queue_depth"
        eval_time: 10m
        exp_samples: []
  - name: A gap in queue refreshes requires a complete hour of fresh history again
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '0+1x110'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x20 1200x14 2160+60x74'
    alert_rule_test:
      - eval_time: 65m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 100m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts: []
      - eval_time: 101m
        alertname: AegisDecisionBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Decision queue has kept growing for an hour"
              description: "The queue grew in each half of the last hour. Check Review & approve, owner assignments and failed filings. See ops/README.md#alert-runbook."
  - name: Replica handover does not double count global depth
    interval: 1m
    input_series:
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="core:8082"}'
        values: '10x10'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="core:8082"}'
        values: '0+60x10'
      - series: 'aegis_decision_queue_depth{job="aegis-core",instance="standby:8082"}'
        values: '10x10'
      - series: 'aegis_decision_queue_last_refresh_timestamp_seconds{job="aegis-core",instance="standby:8082"}'
        values: '0+60x10'
    promql_expr_test:
      - expr: "aegis:decision_queue_depth"
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="aegis:decision_queue_depth"}'
            value: 10
  - name: 5xx above one percent holds for ten minutes
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="200"}'
        values: '0+98x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="500"}'
        values: '0+2x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: AegisHighErrorRate
        exp_alerts: []
      - eval_time: 11m
        alertname: AegisHighErrorRate
        exp_alerts:
          - exp_labels:
              job: "gateway"
              severity: "critical"
            exp_annotations:
              summary: "gateway has exceeded 1% HTTP 5xx for 10 minutes"
              description: "The 5-minute 5xx fraction excludes Actuator traffic. Inspect service logs and Zipkin before retrying external actions. See ops/README.md#alert-runbook."
  - name: Exactly one percent does not alert
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="200"}'
        values: '0+99x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="500"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AegisHighErrorRate
        exp_alerts: []
  - name: Idle traffic and actuator errors do not alert
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="200"}'
        values: '0x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="500"}'
        values: '0x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/actuator/prometheus",status="500"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AegisHighErrorRate
        exp_alerts: []
  - name: Error recovery resolves the alert
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="200"}'
        values: '0+98x15 1570+100x20'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="500"}'
        values: '0+2x15 30x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: AegisHighErrorRate
        exp_alerts:
          - exp_labels:
              job: "gateway"
              severity: "critical"
            exp_annotations:
              summary: "gateway has exceeded 1% HTTP 5xx for 10 minutes"
              description: "The 5-minute 5xx fraction excludes Actuator traffic. Inspect service logs and Zipkin before retrying external actions. See ops/README.md#alert-runbook."
      - eval_time: 30m
        alertname: AegisHighErrorRate
        exp_alerts: []
  - name: Errors stay per service and multiple instances aggregate
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="200"}'
        values: '0+999.5x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway:8080",uri="/api/example",status="500"}'
        values: '0+0.5x30'
      - series: 'http_server_requests_seconds_count{job="identity-service",instance="identity-service:8080",uri="/api/example",status="200"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway-other:8080",uri="/api/example",status="200"}'
        values: '0x30'
      - series: 'http_server_requests_seconds_count{job="gateway",instance="gateway-other:8080",uri="/api/example",status="500"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AegisHighErrorRate
        exp_alerts: []
  - name: Scrape failure holds for five minutes
    interval: 1m
    input_series:
      - series: 'up{job="aegis-core",instance="core:8082"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: AegisServiceDown
        exp_alerts: []
      - eval_time: 5m
        alertname: AegisServiceDown
        exp_alerts:
          - exp_labels:
              job: "aegis-core"
              instance: "core:8082"
              severity: "critical"
            exp_annotations:
              summary: "aegis-core cannot be scraped for 5 minutes"
              description: "Check the container and scrape target; feed metrics cannot report failure while aegis-core itself is unavailable. See ops/README.md#alert-runbook."
      - eval_time: 6m
        alertname: AegisServiceDown
        exp_alerts: []
