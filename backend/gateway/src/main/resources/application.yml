server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  # Validate identity-service's RS256 tokens against its JWKS (lazy decoder — startup does not block
  # on identity-service being up).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

# Downstream service URIs the routes forward to (see RouteConfig).
gateway:
  identity-uri: ${IDENTITY_URI:http://localhost:8081}
  core-uri: ${CORE_URI:http://localhost:8082}
  # Callers whose X-Forwarded-For the gateway passes on (a Java regex over the caller's IP; see
  # ForwardedForFilter). The frontend's BFF sends the browser's address there, and identity-service's /auth
  # rate limit and audit log key on it; anyone else's claim is replaced with their own address. Only the BFF
  # should reach the gateway (compose's network, a security group in AWS), so the default trusts private
  # and loopback addresses. Narrow it to the frontend's subnets where they're known.
  trusted-proxies: '${GATEWAY_TRUSTED_PROXIES:10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+|127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1}'

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: gateway
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "
