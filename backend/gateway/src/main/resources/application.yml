server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  # Validate identity-service's RS256 tokens against its JWKS (lazy decoder — startup does not block
  # on identity-service being up).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

# Downstream service URIs the routes forward to (see RouteConfig).
gateway:
  identity-uri: ${IDENTITY_URI:http://localhost:8081}
  core-uri: ${CORE_URI:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: gateway
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
