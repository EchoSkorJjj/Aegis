name: gateway-ci

on:
  push:
    paths:
      - "backend/gateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "security/access-control.md"   # the access tests read it
      - "testing/**"                   # the coverage targets and their check
  pull_request:
    paths:
      - "backend/gateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "security/access-control.md"   # the access tests read it
      - "testing/**"                   # the coverage targets and their check

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # No gateway tests yet — `verify` compiles and packages now, and will run tests
      # automatically once they're added under backend/gateway/src/test.
      - name: Build and run tests
        working-directory: backend/gateway
        run: mvn -B verify

      # Coverage against testing/coverage-targets.json, in the job summary; below target fails the job.
      - name: Check coverage against targets
        run: python3 testing/check_coverage.py gateway backend/gateway/target/site/jacoco/jacoco.xml

      - name: Retain the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gateway-coverage
          path: backend/gateway/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
