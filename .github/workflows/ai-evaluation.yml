name: ai-evaluation

# The golden cases against the real model (Groq), three runs each, compared with the committed baseline
# (backend/ai-service/evaluation-baseline.json): a change that makes a case fall below its pass rate, break a constraint,
# or lose more than 10 points of mean score fails the run (CS203-231). The golden replay in ai-service-ci can't see a
# prompt or model change; this can. It runs only when the AI changes, or on demand: a run costs about 90,000 tokens of
# the Groq account, so runs never overlap.
on:
  pull_request:
    paths:
      - "backend/ai-service/src/ai_service/prompts/**"
      - "backend/ai-service/src/ai_service/capabilities/**"
      - "backend/ai-service/src/ai_service/llm/**"
      - "backend/ai-service/src/ai_service/evaluation/**"
      - "backend/ai-service/src/ai_service/schemas.py"
      - "backend/ai-service/evaluation-baseline.json"
      - ".github/workflows/ai-evaluation.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/ai-service/src/ai_service/prompts/**"
      - "backend/ai-service/src/ai_service/capabilities/**"
      - "backend/ai-service/src/ai_service/llm/**"
      - "backend/ai-service/src/ai_service/evaluation/**"
      - "backend/ai-service/src/ai_service/schemas.py"
      - "backend/ai-service/evaluation-baseline.json"
      - ".github/workflows/ai-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend/ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ai-service/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      # Each case three times: quality must pass on two runs in three and the constraints on every run
      # (ai_service.evaluation.rubric). The per-type pass rates and mean scores go to the job summary.
      - name: Evaluate against the real model and the baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add the GROQ_API_KEY repository secret (Settings > Secrets and variables > Actions) to run the evaluation."
            exit 1
          fi
          python -m ai_service.evaluation --provider groq --runs 3 \
            --baseline evaluation-baseline.json --max-score-drop 10 --output "$RUNNER_TEMP/ai-evaluation"

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation
          path: ${{ runner.temp }}/ai-evaluation/
          if-no-files-found: ignore
          retention-days: 30
