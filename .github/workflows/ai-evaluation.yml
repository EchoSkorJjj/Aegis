name: ai-evaluation

# The golden cases against the real model (Groq), three runs each, compared with the committed baseline
# (backend/ai-service/evaluation-baseline.json) on what three runs can measure (CS203-231): a draft type's or
# capability's mean score falling more than 5 points, a case's more than 15, more runs breaking a constraint than the
# baseline plus 2, or a guardrail case not blocked, fails the run. A case changing verdict is listed in the summary,
# not failed on: a case near its pass rate changes between runs of the same code. A run Groq didn't answer (its rate or
# quota limit) scores nothing, so with any the run fails as inconclusive, comparing no scores; re-run it later. The
# golden replay in ai-service-ci can't see a prompt or model change; this can. A run costs about 90,000 tokens of the
# Groq account's allowance, so it runs only on a pull request into develop that changes the AI (each push to one runs
# it again), never on a push or a pull request into main: that code was evaluated on its way into develop. (Running on
# the merge into develop and on the pull request into main evaluated one commit twice on 2026-11-08, after its pull
# request had, and Groq stopped answering.) Re-run it from the Actions page, or on demand; runs never overlap.
on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/ai-service/src/ai_service/prompts/**"
      - "backend/ai-service/src/ai_service/capabilities/**"
      - "backend/ai-service/src/ai_service/llm/**"
      - "backend/ai-service/src/ai_service/evaluation/**"
      - "backend/ai-service/src/ai_service/schemas.py"
      - "backend/ai-service/evaluation-baseline.json"
      - ".github/workflows/ai-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend/ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ai-service/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      # Each case three times: quality must pass on two runs in three and the constraints on every run
      # (ai_service.evaluation.rubric); the regression thresholds are fixed in ai_service.evaluation.runner. The
      # per-type pass rates and mean scores, the regressions and the changed verdicts go to the job summary.
      - name: Evaluate against the real model and the baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add the GROQ_API_KEY repository secret (Settings > Secrets and variables > Actions) to run the evaluation."
            exit 1
          fi
          python -m ai_service.evaluation --provider groq --runs 3 \
            --baseline evaluation-baseline.json --output "$RUNNER_TEMP/ai-evaluation"

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation
          path: ${{ runner.temp }}/ai-evaluation/
          if-no-files-found: ignore
          retention-days: 30
