name: identity-service-ci

on:
  push:
    paths:
      - "backend/identity-service/**"
      - ".github/workflows/identity-service-ci.yml"
      - "security/access-control.md"   # the access tests read it
  pull_request:
    paths:
      - "backend/identity-service/**"
      - ".github/workflows/identity-service-ci.yml"
      - "security/access-control.md"   # the access tests read it

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # GitHub-hosted runners include Docker, so Testcontainers works
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run integration tests
        working-directory: backend/identity-service
        run: mvn -B verify
