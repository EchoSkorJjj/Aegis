<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aegis's services and how they talk. The source of system-architecture.png: edit this file, then render it again
  (see README.md here). Icons come from Iconify's open-source sets (logos: brand icons; lucide: glyphs).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="700"
     viewBox="0 0 1500 700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #232F3E; }
      .subtitle { font-size: 14px; fill: #545B64; }
      .group { font-size: 14px; font-weight: 600; fill: #232F3E; }
      .name { font-size: 14px; font-weight: 600; fill: #232F3E; text-anchor: middle; }
      .detail { font-size: 12px; fill: #545B64; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #AAB7B8; stroke-width: 1.2; }
      .card-name { font-size: 15px; font-weight: 600; fill: #232F3E; }
      .card-detail { font-size: 12px; fill: #545B64; }
      .edge { stroke: #232F3E; stroke-width: 1.6; fill: none; }
      .edge-label { font-size: 12px; fill: #232F3E; }
    </style>
  </defs>

  <rect width="1500" height="700" fill="#FFFFFF"/>

  <text x="40" y="50" class="title">Aegis: services and how they talk</text>
  <text x="40" y="76" class="subtitle">The browser talks only to the frontend; aegis-core owns the domain; the AI only drafts</text>

  <!-- Email, above: identity-service's messages -->
  <image href="https://api.iconify.design/lucide/mail.svg?color=%23545B64" x="790" y="22" width="40" height="40"/>
  <text x="810" y="80" class="name">Email</text>
  <text x="810" y="96" class="detail">Amazon SES in AWS, Mailhog locally</text>

  <!-- Browser, left -->
  <image href="https://api.iconify.design/lucide/monitor.svg?color=%23232F3E" x="60" y="402" width="44" height="44"/>
  <text x="82" y="466" class="name">Browser</text>
  <text x="82" y="482" class="detail">holds only cookies</text>

  <!-- Aegis -->
  <rect x="190" y="130" width="1000" height="380" rx="10" fill="#F7F9FA" stroke="#232F3E" stroke-width="1.4"/>
  <image href="https://api.iconify.design/lucide/hexagon.svg?color=%23232F3E" x="204" y="140" width="20" height="20"/>
  <text x="232" y="156" class="group">Aegis</text>

  <rect x="700" y="165" width="220" height="90" rx="10" class="card"/>
  <image href="https://api.iconify.design/logos/spring-icon.svg" x="712" y="194" width="32" height="32"/>
  <text x="754" y="198" class="card-name">identity-service</text>
  <text x="754" y="216" class="card-detail">accounts, MFA,</text>
  <text x="754" y="232" class="card-detail">organizations, audit log</text>

  <image href="https://api.iconify.design/logos/postgresql.svg" x="1016" y="170" width="48" height="48"/>
  <text x="1040" y="238" class="name">PostgreSQL 16</text>
  <text x="1040" y="254" class="detail">one schema per service</text>

  <rect x="220" y="380" width="180" height="90" rx="10" class="card"/>
  <image href="https://api.iconify.design/logos/nextjs-icon.svg" x="232" y="409" width="32" height="32"/>
  <text x="274" y="421" class="card-name">frontend</text>
  <text x="274" y="439" class="card-detail">Next.js UI and BFF</text>

  <rect x="450" y="380" width="180" height="90" rx="10" class="card"/>
  <image href="https://api.iconify.design/logos/spring-icon.svg" x="462" y="409" width="32" height="32"/>
  <text x="504" y="421" class="card-name">gateway</text>
  <text x="504" y="439" class="card-detail">checks every JWT,</text>
  <text x="504" y="455" class="card-detail">routes the request</text>

  <rect x="700" y="380" width="220" height="90" rx="10" class="card"/>
  <image href="https://api.iconify.design/logos/spring-icon.svg" x="712" y="409" width="32" height="32"/>
  <text x="754" y="421" class="card-name">aegis-core</text>
  <text x="754" y="439" class="card-detail">estate, feeds, matching,</text>
  <text x="754" y="455" class="card-detail">scoring, responses</text>

  <rect x="1010" y="380" width="170" height="90" rx="10" class="card"/>
  <image href="https://api.iconify.design/logos/fastapi-icon.svg" x="1022" y="409" width="32" height="32"/>
  <text x="1064" y="421" class="card-name">ai-service</text>
  <text x="1064" y="439" class="card-detail">drafts behind</text>
  <text x="1064" y="455" class="card-detail">a strict schema</text>

  <!-- Outside, right and below -->
  <image href="https://api.iconify.design/thesvg-color/groq.svg" x="1308" y="403" width="44" height="44"/>
  <text x="1330" y="466" class="name">Groq</text>
  <text x="1330" y="482" class="detail">the drafting model</text>

  <image href="https://api.iconify.design/lucide/shield-alert.svg?color=%23D13212" x="620" y="566" width="40" height="40"/>
  <text x="640" y="624" class="name">NVD, OSV</text>
  <text x="640" y="640" class="detail">advisories</text>
  <image href="https://api.iconify.design/lucide/rss.svg?color=%23ED7100" x="920" y="566" width="40" height="40"/>
  <text x="940" y="624" class="name">Status pages, news</text>
  <text x="940" y="640" class="detail">outages, threat news</text>

  <rect x="1080" y="552" width="320" height="104" rx="8" fill="none" stroke="#AAB7B8" stroke-dasharray="4 3"/>
  <image href="https://api.iconify.design/logos/github-icon.svg" x="1140" y="566" width="40" height="40"/>
  <text x="1160" y="624" class="name">GitHub</text>
  <text x="1160" y="640" class="detail">SBOM clones, draft PRs</text>
  <image href="https://api.iconify.design/logos/jira.svg" x="1300" y="566" width="40" height="40"/>
  <text x="1320" y="624" class="name">Jira</text>
  <text x="1320" y="640" class="detail">risk tickets</text>

  <!-- Edges -->
  <path d="M110 424 L 214 424" class="edge" marker-end="url(#arrow)"/>
  <text x="116" y="416" class="edge-label">httpOnly cookies</text>

  <path d="M400 424 L 444 424" class="edge" marker-end="url(#arrow)"/>

  <path d="M630 424 L 694 424" class="edge" marker-end="url(#arrow)"/>
  <text x="648" y="416" class="edge-label">/api</text>

  <path d="M600 380 L 694 236" class="edge" marker-end="url(#arrow)"/>
  <text x="514" y="304" class="edge-label">/auth, /users, /orgs</text>

  <path d="M810 380 L 810 261" class="edge" marker-end="url(#arrow)"/>
  <text x="818" y="318" class="edge-label">checks members</text>
  <text x="818" y="334" class="edge-label">with the user's token</text>

  <path d="M920 208 L 1008 200" class="edge" marker-end="url(#arrow)"/>
  <path d="M890 380 L 1026 266" class="edge" marker-end="url(#arrow)"/>

  <path d="M920 424 L 1004 424" class="edge" marker-end="url(#arrow)"/>
  <text x="924" y="416" class="edge-label">service token</text>

  <path d="M1180 424 L 1300 424" class="edge" marker-end="url(#arrow)"/>

  <path d="M780 470 L 660 560" class="edge" marker-end="url(#arrow)"/>
  <path d="M840 470 L 920 560" class="edge" marker-end="url(#arrow)"/>
  <text x="810" y="540" class="edge-label" text-anchor="middle">scheduled pulls</text>

  <path d="M900 462 C 1040 480, 1180 500, 1236 546" class="edge" marker-end="url(#arrow)"/>
  <text x="1070" y="566" class="edge-label" text-anchor="end">PRs and tickets</text>
  <text x="1070" y="580" class="edge-label" text-anchor="end">only on approval</text>

  <path d="M810 165 L 810 104" class="edge" marker-end="url(#arrow)"/>
  <text x="818" y="122" class="edge-label">verification, sign-in codes</text>
</svg>
